<!DOCTYPE html>
<html lang="en" data-bs-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Newsletter Designer — fsharp-wasm</title>
  <!-- the chrome of the tool is plain Bootstrap 5.3 (a local copy, see vendor/bootstrap); the profile of the newsletter is something else -->
  <link rel="stylesheet" href="vendor/bootstrap/bootstrap.min.css">
  <link rel="stylesheet" href="designer.css">
</head>
<body>
  <p id="status" class="visually-hidden" role="status">Loading the designer…</p>
  <div id="app"></div>
  <noscript><p class="p-3">The designer is a WebAssembly program and needs JavaScript to start it.</p></noscript>
  <script type="module">
    // where the glue and the module are: web/paths.js in a checkout, written by build/site.sh for the deployed site
    import { runtime, wasm } from "./paths.js";
    const { boot } = await import(runtime + "boot.js");
    await boot({ wasm: new URL(wasm, import.meta.url), entry: "start" });

    // One thing the page does for the module, in a few lines; the designer itself is F#.  (The preview frame is sandboxed and talks to the module through
    // messages: that relay is F# too, Browser.Events.onFrameMessage.)
    // Download: a button names the file and the element that holds the text.
    document.addEventListener("click", (e) => {
      const b = e.target.closest?.("[data-download]");
      const src = b && document.querySelector(b.dataset.source);
      if (!src) return;
      const url = URL.createObjectURL(new Blob([src.value ?? src.textContent], { type: b.dataset.type || "text/plain" }));
      const a = Object.assign(document.createElement("a"), { href: url, download: b.dataset.download });
      a.click();
      URL.revokeObjectURL(url);
    });
  </script>
</body>
</html>
