name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  # the compiler the designer is built with (a fsharp-wasm revision; replace by a release binary when there is one)
  COMPILER_REF: 894ad2f7704dd2dba3c45ed0ff6e99a5bf8c708e

jobs:
  # The library and its suites under .NET.
  dotnet:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Submodules
        run: git submodule update --init lib/fsharp-wasm-core lib/graphics lib/wasmecto lib/runtime
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Suites under .NET
        run: bash build/test.sh dotnet

  # The same suites as WebAssembly GC, the designer module, and the designer driven in Chromium.
  wasm:
    runs-on: ubuntu-24.04   # Playwright does not support chromium on ubuntu-latest (26.04) yet
    steps:
      - uses: actions/checkout@v6
      - name: Submodules
        run: git submodule update --init lib/fsharp-wasm-core lib/graphics lib/wasmecto lib/runtime

      - name: Compiler checkout
        uses: actions/checkout@v6
        with:
          repository: fsharp-wasm/fsharp-wasm
          ref: ${{ env.COMPILER_REF }}
          path: compiler
      - name: Compiler submodules
        run: git -C compiler submodule update --init --depth 1 vendor/Fable vendor/fsharp core

      - uses: actions/setup-node@v6
        with:
          node-version: '22'

      # vendor/fsharp pins the 10.0.3xx SDK band (no roll-forward): 10.0.303 builds the patched F# compiler.  The build is cached
      # per revision of that submodule (the compiler's own CI does the same).
      - name: Patched F# compiler (cache)
        id: fsc
        uses: actions/cache@v5
        with:
          path: compiler/vendor/fsharp/artifacts/bin/fsc/Release/net10.0
          key: fsc-${{ runner.os }}-${{ hashFiles('compiler/.gitmodules') }}-${{ env.COMPILER_REF }}
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            10.0.303
            10.0.x
      - name: Patched F# compiler (build)
        if: steps.fsc.outputs.cache-hit != 'true'
        working-directory: compiler/vendor/fsharp
        run: |
          mkdir -p artifacts
          ./build/build.sh -c Release
          test -f artifacts/bin/fsc/Release/net10.0/fsc.dll

      # a fixed version (the one the checks were made with); no call to the GitHub API, whose unauthenticated limit failed this step
      - name: Install wasm-tools
        env:
          WASM_TOOLS: 1.263.0
        run: |
          curl -sSfL --retry 4 "https://github.com/bytecodealliance/wasm-tools/releases/download/v${WASM_TOOLS}/wasm-tools-${WASM_TOOLS}-x86_64-linux.tar.gz" | tar xz -C "$RUNNER_TEMP"
          sudo install -m755 "$RUNNER_TEMP/wasm-tools-${WASM_TOOLS}-x86_64-linux/wasm-tools" /usr/local/bin/wasm-tools
          wasm-tools --version

      - name: Suites as WebAssembly GC
        env:
          FSHARP_WASM_DIR: ${{ github.workspace }}/compiler
          FSHARP_COMPILER: ${{ github.workspace }}/compiler/vendor/fsharp/artifacts/bin/fsc/Release/net10.0/fsc.dll
        run: bash build/test.sh wasm

      - name: Build the designer
        env:
          FSHARP_WASM_DIR: ${{ github.workspace }}/compiler
          FSHARP_COMPILER: ${{ github.workspace }}/compiler/vendor/fsharp/artifacts/bin/fsc/Release/net10.0/fsc.dll
        run: bash build/build.sh

      - name: Install Playwright and Chromium
        run: |
          npm ci --ignore-scripts
          npx playwright install --with-deps chromium
      - name: Designer in Chromium
        run: node tests/e2e/designer.mjs

      # the deployable site (static files), checked the way it is served: under the headers of site/_headers, and with the
      # deploy tool's dry run (no account needed)
      - name: Site package
        run: bash build/site.sh
      - name: Site in Chromium, under the production headers
        run: E2E_SITE=dist/site node tests/e2e/designer.mjs
      # GitHub Pages cannot send headers: the policy becomes a <meta>, and the site lives under /<repository>/
      - name: Site as GitHub Pages serves it (policy as <meta>, under a path)
        run: |
          node build/pages.mjs dist/site dist/pages
          E2E_SITE=dist/pages E2E_PREFIX=/${GITHUB_REPOSITORY#*/} node tests/e2e/designer.mjs
      - name: Cloudflare dry run
        run: |
          grep -E '^[A-Z_]+=' .github/tool-versions.env >> "$GITHUB_ENV"
          source .github/tool-versions.env
          npx --yes "$WRANGLER" deploy --dry-run
      - uses: actions/upload-artifact@v7
        with:
          name: site
          path: dist/site
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        with:
          name: pages
          path: dist/pages
          if-no-files-found: error

      - uses: actions/upload-artifact@v7
        with:
          name: NewsletterDesigner
          path: |
            dist/NewsletterDesigner.wasm
            docs/images/*.png
